@media (max-width:480px){

}

async function hp(n,p){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("vod|"+n+"|"+p));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,doc,onSnapshot,setDoc,deleteDoc,runTransaction,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBen1ur-F40Y3zGp_HzhgFH6IWsyngXGCQ",authDomain:"vod2-6f690.firebaseapp.com",projectId:"vod2-6f690",storageBucket:"vod2-6f690.firebasestorage.app",messagingSenderId:"341332081702",appId:"1:341332081702:web:29f79ab1ff2647126c7ae7"});
const db=getFirestore(app),C=["users","soldiers","weapons","codes"],shadow={users:{},soldiers:{},weapons:{},codes:{}},loaded={};
const idk=c=>c=="codes"?"c":"id";
function cur(c){const m={};if(c=="users"){for(const k in S.users)m[k]=S.users[k]}else S[c].forEach(x=>{m[String(x[idk(c)])]=x});return m}
const fail=e=>{S.err="Fehler: "+(e&&e.message||e);refresh()};

function push(){C.forEach(c=>{const m=cur(c),sh=shadow[c];
for(const k in m){const j=JSON.stringify(m[k]);if(sh[k]!==j){sh[k]=j;setDoc(doc(db,c,k),m[k]).catch(fail)}}
for(const k in sh){if(!(k in m)){delete sh[k];deleteDoc(doc(db,c,k)).catch(fail)}}})}
C.forEach(c=>onSnapshot(collection(db,c),{includeMetadataChanges:true},snap=>{S.off=snap.metadata.fromCache&&!snap.metadata.hasPendingWrites;const m={};snap.forEach(d=>{m[d.id]=d.data()});shadow[c]={};for(const k in m)shadow[c][k]=JSON.stringify(m[k]);
if(c=="users")S.users=m;else if(c=="codes")S.codes=Object.values(m).sort((a,b)=>(b.t||0)-(a.t||0));else S[c]=Object.values(m).sort((a,b)=>a.id-b.id);
loaded[c]=1;if(C.every(k=>loaded[k]))S.ready=true;refresh()},fail));
window.DB={push,
async redeem(v,me){try{return await runTransaction(db,async tx=>{const cr=doc(db,"codes",v),ur=doc(db,"users",me),cs=await tx.get(cr),us=await tx.get(ur);
if(!cs.exists())return{r:"bad"};const c=cs.data(),u=us.data();if(u.blocked)return{r:"blocked"};if(c.by.length>=c.m)return{r:"bad"};if(c.by.includes(me))return{r:"again"};
c.by.push(me);u.money+=c.a;tx.set(cr,c);tx.set(ur,u);return{r:"ok",a:c.a}})}catch(e){return{r:"err"}}},

</script>
