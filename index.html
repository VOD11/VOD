<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#050505;--card:#0f0f0f;--in:#1a1a1a;--tx:#f4f4f4;--mu:#9a9a9a;--ac:#f2f2f2;--ok:#78c982;--bad:#ee5126;--bd:#2c2c2c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:600 15px/1.4 Cinzel,"Trajan Pro",Georgia,serif}
#app{max-width:640px;margin:0 auto;min-height:100vh}
.hero{padding:40px 20px 22px;text-align:center;background:radial-gradient(700px 300px at 50% 0,#262626 0,transparent 70%),repeating-linear-gradient(115deg,#0a0a0a 0 9px,#0f0f0f 9px 18px,#070707 18px 30px)}
.logo{margin:0 auto 4px;display:grid;place-items:center}.lg{width:44px;height:44px;object-fit:contain}.logo .lg{width:190px;height:190px}.mt{color:var(--mu);letter-spacing:4px;font-size:11px;margin-top:8px;text-transform:uppercase}
.big{font-size:46px;letter-spacing:12px;font-weight:700;margin:0}.sub{color:var(--ac);letter-spacing:5px;font-size:12px;text-transform:uppercase}
.pan{margin:0 16px;padding:22px;background:var(--card);border:1px solid var(--bd);border-radius:12px}
h2{margin:0 0 16px;font-size:20px;letter-spacing:4px;text-transform:uppercase}
label{display:block;color:var(--mu);font-size:12px;letter-spacing:3px;text-transform:uppercase;margin:12px 0 6px}
input{width:100%;padding:15px;background:var(--in);border:1px solid transparent;border-radius:8px;color:var(--tx);font:inherit;font-size:16px}
input:focus{outline:0;border-color:var(--ac)}
.btn{display:block;width:100%;padding:15px;margin-top:14px;border:0;border-radius:8px;background:var(--ac);color:var(--on);font:inherit;font-size:17px;letter-spacing:3px;text-transform:uppercase;font-weight:700}
.btn.ok{background:var(--ok)}.btn.no{background:var(--bad);color:#fff}
.lnk{display:block;text-align:center;color:var(--ac);margin:16px 0 8px;background:0;border:0;font:inherit;width:100%}
.lang{display:inline-flex;background:var(--in);border-radius:8px;padding:3px}.lang b{padding:7px 12px;border-radius:6px;color:var(--mu);letter-spacing:2px;font-size:14px}.lang b{cursor:pointer}.lang b.on{background:var(--ac);color:var(--on)}
.foot{text-align:center;color:var(--mu);font-size:11px;letter-spacing:3px;text-transform:uppercase;padding:22px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 16px;border-bottom:1px solid var(--bd)}
.top h1{margin:0;font-size:24px;letter-spacing:5px;text-transform:uppercase}.top i{color:var(--ac);font-style:normal;letter-spacing:4px;font-size:11px}
.tabs{display:flex;margin:16px;padding:4px;background:var(--card);border:1px solid var(--bd);border-radius:8px}
.tabs button{flex:1;padding:12px 4px;border:0;border-radius:6px;background:0;color:var(--mu);font:inherit;letter-spacing:3px;text-transform:uppercase;font-size:13px}
.tabs button.on{background:var(--ac);color:var(--on);font-weight:700}
.list{padding:0 16px 120px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nm{font-size:19px;letter-spacing:3px;text-transform:uppercase}.mu{color:var(--mu);font-size:14px;letter-spacing:1px}
.tag{border:1px solid var(--ok);color:var(--ok);border-radius:5px;padding:4px 10px;font-size:11px;letter-spacing:3px}.tag.p{border-color:#e6c229;color:#e6c229}.tag.b{border-color:var(--bad);color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts button,.ic{background:var(--in);border:0;border-radius:8px;color:var(--ac);padding:12px 14px;font:inherit;font-size:15px}.acts button.r,.ic.r{color:var(--bad)}
.item{display:flex;align-items:center;gap:12px}.th{width:44px;height:44px;border-radius:6px;background:var(--in);border:1px solid var(--bd);display:grid;place-items:center;font-size:22px;flex:none}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.dock .btn{margin:0;max-width:608px;margin-inline:auto}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:9}
.sheet>div{width:100%;max-width:640px;margin:0 auto;background:var(--card);border-top:1px solid var(--bd);border-radius:14px 14px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.two{display:flex;gap:10px}.two .btn{margin-top:12px}
.msg{min-height:22px;margin-top:10px;font-weight:700}.err{color:var(--bad)}.good{color:var(--ok)}
.org{color:var(--ac)}.sec{color:var(--ac);letter-spacing:4px;font-size:13px;margin:16px 0 6px}
.sp{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bd)}.sp b{color:var(--ac)}
code{font-size:20px;letter-spacing:4px;color:var(--ac)}
.sub2{color:var(--mu);letter-spacing:5px;font-size:12px;text-transform:uppercase}.act{color:var(--ok);background:var(--in);padding:8px 12px;border-radius:6px;letter-spacing:3px;font-size:12px;text-transform:uppercase}
.wal{background:var(--in);color:var(--ac);padding:10px 14px;border-radius:8px;font-size:18px;font-weight:700}
.big2{padding:20px}.lab{letter-spacing:4px;font-size:13px;text-transform:uppercase}.amt{font-size:46px;font-weight:700;margin:8px 0 16px}
.tri{display:flex;border-top:1px solid var(--bd);padding-top:16px}.tri div{flex:1;text-align:center;color:var(--mu);letter-spacing:3px;font-size:12px;text-transform:uppercase}.tri b{display:block;color:var(--tx);font-size:26px;letter-spacing:0}
.sech{display:flex;align-items:center;gap:10px;letter-spacing:4px;text-transform:uppercase;font-size:14px;margin:22px 0 12px}.sech:after{content:"";flex:1;height:1px;background:var(--bd)}
.empty{border:1px dashed var(--bd);border-radius:10px;padding:24px;text-align:center;color:var(--mu);background:var(--card);margin-bottom:12px}
.unit{display:flex;gap:12px}.th2{width:64px;height:64px;border-radius:8px;background:var(--in);border:1px solid var(--bd);display:grid;place-items:center;font-size:30px;flex:none}.gr{flex:1;min-width:0}.nm2{font-size:18px}.chips{display:flex;gap:8px;margin-top:8px}.chip{background:var(--in);border-radius:6px;padding:5px 10px;font-size:14px}
.rt{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px}.pc{background:var(--in);color:var(--ac);padding:6px 10px;border-radius:6px;font-weight:700;display:inline-block;margin:6px 0}
.rb{background:var(--ac);color:var(--on);border:0;border-radius:6px;padding:12px 16px;font:inherit;letter-spacing:3px;text-transform:uppercase;font-weight:700}.rb.full{width:100%;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wc{margin:0}.img{height:110px;border-radius:8px;background:linear-gradient(135deg,var(--in),var(--bg));display:grid;place-items:center;font-size:44px;position:relative;margin-bottom:10px}.tg{position:absolute;top:8px;left:8px;border:1px solid var(--ac);color:var(--ac);background:rgba(0,0,0,.5);border-radius:5px;padding:4px 8px;font-size:11px;letter-spacing:3px;text-transform:uppercase}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}.nav button{flex:1;padding:12px 4px;background:0;border:0;color:var(--mu);font:inherit;letter-spacing:2px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px}.nav button.on{color:var(--ac)}.nav span{font-size:22px;filter:grayscale(1)}.nav .on span{filter:none}
.av{width:92px;height:92px;margin:18px auto 14px;border:1.5px solid var(--ac);border-radius:14px;background:var(--in);display:grid;place-items:center;font-size:44px}.pn{margin:0;font-size:34px;letter-spacing:6px;text-transform:uppercase}.rank{display:inline-block;margin:12px 0 20px;background:var(--in);color:var(--ac);border-radius:8px;padding:10px 16px;letter-spacing:4px;text-transform:uppercase}
.st{display:flex;gap:12px}.st .card{flex:1}.st b{display:block;font-size:26px}.st span{color:var(--mu);font-size:12px;letter-spacing:4px;text-transform:uppercase}
.lo{background:transparent;color:var(--tx);border:1px solid var(--bd)}
html{-webkit-text-size-adjust:100%}
#app{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.pan{margin:0 auto;width:calc(100% - 32px);max-width:520px}
button{cursor:pointer;min-height:44px}button:hover{filter:brightness(1.12)}.lang b{min-height:0}
.card{overflow-wrap:anywhere}
@media (min-width:860px){
#app{max-width:1120px}
.hero{padding:70px 20px 34px}.big{font-size:56px}
.top{padding:22px 24px}.tabs{margin:20px 24px}.list{padding:0 24px 120px}
.list:not([style]){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.list:not([style])>.card{margin:0}
.list:not([style])>.msg,.list:not([style])>.sech,.list:not([style])>.empty,.list:not([style])>.big2,.list:not([style])>.grid{grid-column:1/-1}
.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.list[style]{max-width:640px;margin:0 auto}
.nav,.dock{max-width:1120px;margin:0 auto}
.sheet{align-items:center}.sheet>div{border-radius:14px;max-width:520px;border:1px solid var(--bd)}
}
@media (max-width:480px){
.big{font-size:38px;letter-spacing:8px}.top h1{font-size:20px;letter-spacing:3px}.top{flex-wrap:wrap}
.tabs button{letter-spacing:1px;font-size:12px;padding:12px 2px}
.acts button{flex:1 1 42%}.amt{font-size:38px}.nm{font-size:17px;letter-spacing:2px}
.th2{width:52px;height:52px;font-size:24px}.rb{padding:12px 10px;letter-spacing:2px;font-size:13px}.pn{font-size:28px;letter-spacing:4px}
.nav button{flex-direction:column;gap:2px;font-size:11px;letter-spacing:1px;padding:8px 2px}
.tri b,.st b{font-size:20px}
}
.btn,.rb{background:linear-gradient(180deg,var(--ac),var(--ac2))}.nm,.top h1{text-shadow:none}.card{border-radius:6px}.sub{letter-spacing:6px;font-size:13px}.tabs button,.btn,.rb,.ic{border-radius:4px}
.rb.wd{background:transparent;color:var(--ac);border:1px solid var(--ac);margin-top:6px}.rb.wd.full{margin-top:8px}select{width:100%;padding:15px;background:var(--in);border:1px solid transparent;border-radius:8px;color:var(--tx);font:inherit;font-size:16px;margin:6px 0}s{opacity:.55;margin-right:4px}
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;z-index:99;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:12px;align-items:center;width:100%;max-width:420px;background:linear-gradient(160deg,var(--card),var(--bg));border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:6px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.65);animation:tin .35s ease}
.toast span{font-size:24px}.toast.out{opacity:0;transform:translateY(-10px);transition:.45s}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.ev{border-left:3px solid var(--ac)}

function tabs(a,cur,fn){return '<div class="tabs">'+a.map(function(x){return '<button class="'+(x[0]==cur?"on":"")+'" onclick="'+fn+'(\''+x[0]+'\')">'+x[1]+'</button>'}).join("")+'</div>'}
function cinfo(c){return c.by.length+"/"+c.m+" "+t("rdm")+(c.by.length?" · "+c.by.map(esc).join(", "):"")}
function stat(u){var n=0,f2=0,w=0;S.soldiers.forEach(function(s){var c=u.sol[s.id]||0;n+=c;f2+=c*s.a});S.weapons.forEach(function(x){var l=u.wep[x.id]||0;if(l){w++;f2+=(x.r||0)*l}});return{n:n,f:f2,w:w}}
function askRank(n){var u=S.users[n];sh={h:t("rk")+" · "+esc(n),b:'<label>'+t("rkp")+'</label><input id="rk" maxlength="30" value="'+esc(u.rank||"")+'"><label>'+t("lvl")+'</label><input id="rl" type="number" inputmode="numeric" min="1" max="5" value="'+(u.lvl||1)+'"><div class="mu" style="margin-top:8px">'+t("lvh")+'</div><button class="btn" onclick="setRank(\''+n+'\')">'+t("sv")+'</button>'};draw()}
function setRank(n){var u=S.users[n];u.rank=$("rk").value.trim().slice(0,30);u.lvl=Math.max(1,Math.min(5,Math.floor(parseFloat($("rl").value)||1)));note(n,"rank",[u.rank||"—",String(u.lvl)]);save();closeSheet()}
function askDisc(n){sh={h:t("dsc")+" · "+esc(n),b:'<label>'+t("dsl")+'</label><input id="dc" type="number" inputmode="numeric" min="0" max="90" value="'+(S.users[n].cd||0)+'"><button class="btn" onclick="setDisc(\''+n+'\')">'+t("sv")+'</button>'};draw()}
function setDisc(n){var v=Math.max(0,Math.min(90,Math.floor(parseFloat($("dc").value)||0)));S.users[n].cd=v;if(v>0)note(n,"disc",[String(v)]);save();closeSheet()}
function resetCd(n){S.users[n].gf=0;S.users[n].dw=-1;save();sh={h:t("cdb")+" · "+esc(n),b:'<div class="mu">'+t("cdr")+'</div>'};draw()}
function toggleFake(n){S.users[n].fake=!S.users[n].fake;save();draw()}
function lft(ms){var d=Math.floor(ms/864e5),h=Math.ceil(ms%864e5/36e5),g=S.lang=="de";return d+(g?"T ":"d ")+h+(g?"Std":"h")}
function perks(u){var h="",l=u.lvl||1;
if(u.cd)h+=`<div class="card row"><span>🏷 ${t("dall")}</span><b class="org">−${u.cd}%</b></div>`;
if(l>=3)h+=`<div class="card"><div class="row"><span>🏷 ${t("wd")} −${wp(u)}%</span><b class="org">${wa(u)?t("wav"):t("wus")}</b></div><div class="mu" style="margin-top:6px">${t("wtip")}</div></div>`;
if(l>=5){var lf=evs().some(function(e){return e.ty=="nocd"})?0:3*864e5-(Date.now()-(u.gf||0)),ps=Object.keys(S.users).filter(function(k){return k!=S.me&&k!="commander"&&S.users[k].st=="ok"&&!S.users[k].blocked});
h+=`<div class="card" style="text-align:left"><div class="row"><span>🎁 ${t("gift")}</span><b class="org">${lf>0?"⏳ "+lft(lf):t("wav")}</b></div><label>${t("gto")}</label><select id="gt">${ps.map(function(k){return '<option value="'+k+'">'+esc(k)+'</option>'}).join("")}</select><label>${t("amt")}</label><input id="gm2" type="number" inputmode="numeric" min="1"><button class="btn" onclick="gift()">${t("gbtn")}</button></div>`}
return h}
async function gift(){var to=$("gt")&&$("gt").value,a=Math.floor(parseFloat($("gm2").value));if(!to||!(a>0))return say(t("gbad"),1);var r=await DB.gift(S.me,to,a,evs().some(function(e){return e.ty=="nocd"}));if(r.r=="ok"){toast("🎁",fmt(t("t_gift"),[a,to]));return say(t("gok"),0)}say(r.r=="cd"?t("gcd")+" "+lft(r.left):r.r=="money"?t("nomo"):t("gbad"),1)}

if(ftab=="we"){S.weapons.forEach(function(x){h+='<div class="card row"><div class="item"><div class="th">🔫</div><div><div class="nm" style="letter-spacing:1px">'+esc(x.n)+'</div><div class="mu">'+f(x.p)+" · UPG "+f(x.u)+" · "+t("max").toUpperCase()+" "+x.m+'</div></div></div><div class="item"><button class="ic" onclick="fa()">✎</button><button class="ic r" onclick="fa()">🗑</button></div></div>'});dock='<button class="btn" onclick="fa()">+ '+t("aw").toUpperCase()+'</button>'}

return h+'</div>'+(dock?'<div class="dock" style="bottom:62px">'+dock+'</div>':"")}
